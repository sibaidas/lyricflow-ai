<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LyricFlow AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#090d16,#111827,#1e3a8a);
overflow:hidden;
color:white;
}

body::before{
content:"";
position:absolute;
width:350px;
height:350px;
background:#2563eb;
border-radius:50%;
filter:blur(150px);
top:-100px;
left:-100px;
animation:move1 10s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:350px;
height:350px;
background:#9333ea;
border-radius:50%;
filter:blur(150px);
bottom:-120px;
right:-100px;
animation:move2 10s infinite alternate;
}

@keyframes move1{
to{
transform:translate(100px,80px);
}
}

@keyframes move2{
to{
transform:translate(-100px,-80px);
}
}

.container{
position:relative;
z-index:1;
width:90%;
max-width:380px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:35px 25px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
font-size:65px;
margin-bottom:15px;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-8px);
}
}

h1{
font-size:34px;
font-weight:700;
margin-bottom:10px;
}

p{
font-size:15px;
color:#d1d5db;
line-height:1.6;
margin-bottom:35px;
}

button{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:16px;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.primary{
background:#2563eb;
color:white;
}

.primary:hover{
background:#1d4ed8;
transform:scale(1.03);
}

.secondary{
background:rgba(255,255,255,.12);
color:white;
}

.secondary:hover{
background:rgba(255,255,255,.22);
transform:scale(1.03);
}

.footer{
margin-top:30px;
font-size:12px;
color:#9ca3af;
}

.version{
margin-top:5px;
color:#60a5fa;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🎵</div>

<h1>LyricFlow AI</h1>

<p>Create beautiful lyrical videos with AI-powered captions, animations and professional editing.</p>

<button class="primary">
➕ New Project
</button>

<button class="secondary">
📂 Open Project
</button>

<button class="secondary">
🎨 Templates
</button>

<button class="secondary">
⚙ Settings
</button>

<div class="footer">
Made with ❤️ by Sibai Das

<div class="version">
Version 1.0
</div>

</div>

</div>

</body>
</html>
